# The web app: its built files, the book covers (a volume, so covers saved after the image was
# built show), the API under /api (as the Vite dev server's proxy passes it: /api/books -> the
# API's /books), the app's public pages as the API renders them (below), and index.html for
# every other path, which the app routes itself.

# the API, for the locations passing it the request's path as the client sent it ($request_uri,
# still encoded: a book id can hold "%20")
upstream seo_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers, on every response. A location with an add_header of its own drops these
    # (nginx keeps only the innermost level's), so those below repeat them. The CSP: scripts only
    # from this site; inline styles allowed (pages' HTML keeps text-align in style attributes);
    # Google Fonts; images from anywhere over https (readers' Google profile pictures). HSTS only
    # counts once the site is reached over https.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # the trailing slash drops the /api prefix
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # chat answers stream from an OpenRouter request
        proxy_read_timeout 120s;
    }

    location /covers/ {
        expires 7d;
        try_files $uri =404;
    }

    # Vite's hashed bundles never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # as at the server level (see above)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # The app's public pages, robots.txt and the sitemaps, from the API (api/seo.controller.ts):
    # index.html with each page's title, description, canonical URL and content, for search
    # engines and link previews. When the API is down, the app as it is.
    location = / {
        proxy_pass http://seo_api/seo/html$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @app;
    }

    location ~ ^/(books|authors|journals)(/|$) {
        proxy_pass http://seo_api/seo/html$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 502 503 504 = @app;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|sitemaps/[^/]+\.xml)$ {
        proxy_pass http://seo_api/seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @app {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # always the latest app
    location = /index.html {
        add_header Cache-Control "no-cache";
        # as at the server level (see above)
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
