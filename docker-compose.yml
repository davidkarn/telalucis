# Tela Lucis with Docker: Postgres, the migrations (run before the API starts), the API, and the
# web app on http://localhost:${WEB_PORT:-8080}.
#   docker compose up -d --build
#   docker compose run --rm api npm run cli -- <command>   (the CLI commands)
#
# Settings come from .env: OPENROUTER_KEY, ADMIN_USERNAME, ADMIN_PASSWORD, and optionally
# POSTGRES_PASSWORD and WEB_PORT; for signing in with Google, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, SESSION_SECRET and ADMIN_GOOGLE_EMAILS (see core/user_auth.ts); and
# EMBEDDINGS_THREADS, the CPU threads the embeddings server uses (all of them when not set).
# DATABASE_URL, REDIS_URL and EMBEDDINGS_URL are set here, pointing at the db, redis and
# embeddings services (those in .env are for running outside Docker).

x-database-url: &database-url
  DATABASE_URL: postgres://tela_lucis:${POSTGRES_PASSWORD:-tela_lucis}@db:5432/tela_lucis
  REDIS_URL: redis://redis:6379
  EMBEDDINGS_URL: http://embeddings:8081/v1

services:
  # Postgres with pgvector, for the passages' embeddings (docker/postgres.Dockerfile)
  db:
    image: tela-lucis-postgres
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: tela_lucis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tela_lucis}
      POSTGRES_DB: tela_lucis
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tela_lucis -d tela_lucis"]
      interval: 5s
      timeout: 5s
      retries: 10

  # the queue of .mobi e-books to make (BullMQ; lib/ebook_queue.ts), kept on disk
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # the embeddings of search terms and passages (lib/embeddings.ts): llama.cpp's server running
  # bge-m3 on the CPU, its model downloaded from Hugging Face on the first start (about 600 MB)
  # into the embeddings-models volume. Only the other services reach it (no port published).
  # The search (GET /search) works without it, by words alone. Passages must be embedded with
  # this same model, quantization and pooling as the search terms to be compared with them.
  # -ub: each passage must fit in one batch, so it's bge-m3's whole context (8192 tokens): a
  # 500-word passage of Greek or OCR noise can run past 2048.
  embeddings:
    image: ghcr.io/ggml-org/llama.cpp:server-b12199
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /models
    command: [
      "-hf", "gpustack/bge-m3-GGUF:Q8_0", "--embedding", "--pooling", "cls",
      "-ub", "8192", "-b", "8192", "-c", "8192", "-t", "${EMBEDDINGS_THREADS:--1}",
      "--host", "0.0.0.0", "--port", "8081",
    ]
    volumes:
      - embeddings-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # the first start downloads the model
      start_period: 10m

  # applies any pending migrations, then exits; the api service's image, built by it
  migrate:
    image: tela-lucis-api
    pull_policy: never
    command: ["npx", "tsx", "migrate.ts", "latest"]
    environment:
      <<: *database-url
    depends_on:
      db:
        condition: service_healthy

  api:
    image: tela-lucis-api
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *database-url
      PORT: "3000"
    volumes:
      # where save-cover writes covers, which the web service serves
      - ./web/public/covers:/app/web/public/covers
      # downloads and OCR output of the import commands
      - ./output:/app/output
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # makes the .mobi e-books the API's readers ask for, into ./output/ebooks, which the api service
  # serves them from (the ebook-worker command; Calibre is in this image only)
  ebook-worker:
    image: tela-lucis-worker
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *database-url
    volumes:
      - ./output:/app/output
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: tela-lucis-web
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/public/covers:/usr/share/nginx/html/covers:ro
    depends_on:
      - api

volumes:
  db-data:
  redis-data:
  embeddings-models:
